#需配置Gateway API CRD(位于config/gateway-api.yaml)才能使用gateway.networking.k8s.io资源
#route使用参考代码: https://github.com/kubernetes-sigs/gateway-api/tree/main/examples
#设置tls的sni规则时发现, 优先级:IngressRoute > Gateway API
#设置http规则时发现, 优先级:Gateway API > IngressRoute
#使用IngressRoute模式同时设置"IngressRouteTCP"的sni规则和"IngressRoute"验证https, 即优先级:IngressRoute > IngressRouteTCP

#traefik中间件(优先使用Gateway API标准设置而不是中间件设置; 如设置filters.type)================begin
--- #拒绝直接IP访问
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: block-ip
  namespace: default
spec:
  ipAllowList:
    sourceRange:
      - "127.0.0.1/32" #只允许本地，变相拒绝外部所有直接IP访问
--- #https规则合并
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: http
  namespace: default
spec:
  chain:
    middlewares:
      - name: worker-processes
      - name: limit-req
      - name: circuit-breaker
      # - name: http2https
      - name: compress
      - name: add-header
      - name: error-4xx
      - name: error-5xx
--- #并行
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: worker-processes
  namespace: default
spec:
  inFlightReq:
    amount: 100
    sourceCriterion:
      ipStrategy:
        depth: 0
--- #限流
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: limit-req
  namespace: default
spec:
  rateLimit: # 1s内接收的平均请求数不大于average，高峰最大burst
    average: 20
    burst: 50
--- #熔断
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: circuit-breaker
  namespace: default
spec:
  circuitBreaker:
    #达?%(要有小数点)流量的网络延迟超?秒, 或网络错误率>?%, 或5xx比例>80% 触发
    expression: >
      LatencyAtQuantileMS(90.0) > 5000 ||
      NetworkErrorRatio() > 0.8 ||
      ResponseCodeRatio(500, 600, 0, 600) > 0.8
    checkPeriod: 10s
    fallbackDuration: 15s
    recoveryDuration: 15s

--- #强制转https(traefik初始配置已设, 这冗余)
# apiVersion: traefik.io/v1alpha1
# kind: Middleware
# metadata:
#   name: http2https
# spec:
#   redirectScheme:
#     scheme: https
#     permanent: true #?308:307 重定向
--- #gzip压缩
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: compress
  namespace: default
spec:
  compress: {}
--- #响应头
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: add-header
  namespace: default
spec:
  headers:
    frameDeny: true #禁止外源iframes,减少点击劫持
    customFrameOptionsValue: SAMEORIGIN #禁止外源iframes,减少点击劫持
    customBrowserXSSValue: "1; mode=block" #禁用旧版XSS过滤器（可能引入漏洞）防XSS攻击
    contentTypeNosniff: true #禁止服务器自动解析资源类型
    stsIncludeSubdomains: true #启用HSTS;要求浏览器总是通过 https
    stsPreload: true #启用HSTS;要求浏览器总是http跳转到https
    stsSeconds: 31536000 # 1年有效期
    customResponseHeaders:
      Wall: "Hi! Welcome!"
      Alt-Svc: 'h3=":443"; h3-29=":443"' #备选服务
      Referrer-Policy: "no-referrer-when-downgrade" # 控制Referer头泄露
--- #错误页
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: error-4xx
  namespace: default
spec:
  errors:
    status:
      - "402-499"
    query: /404.html
    service:
      name: pan-svc
      port: 80
--- #错误页
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: error-5xx
  namespace: default
spec:
  errors:
    status:
      - "500-599"
    query: /50x.html
    service:
      name: pan-svc
      port: 80
--- #密码授权验证
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: auth
  namespace: default
spec:
  basicAuth:
    secret: secret
    removeHeader: true #删除验证头
--- #修改url
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: add-sub-prefix
  namespace: default
spec:
  addPrefix:
    prefix: /sub
--- #后台管理/API专用轻量中间件链（仅保留安全头和压缩，去除熔断、限流与错误页重定向）
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: admin-http
  namespace: default
spec:
  chain:
    middlewares:
      - name: add-header
      - name: compress

#================end

---
apiVersion: traefik.io/v1alpha1
kind: TLSOption
metadata:
  name: tls-conf
spec:
  minVersion: VersionTLS12 # 最低TLS版本
  sniStrict: true # 强制 SNI 检查，防止 IP 扫描泄露域名
  preferServerCipherSuites: true # 优先使用服务器端加密套件
  cipherSuites: # 允许的加密套件
    - TLS_AES_256_GCM_SHA384 #TLS1.3
    - TLS_CHACHA20_POLY1305_SHA256 #TLS1.3
    - TLS_AES_128_GCM_SHA256 #TLS1.3
    - ECDHE-ECDSA-AES256-GCM-SHA384 #TLS1.2
    - ECDHE-RSA-AES256-GCM-SHA384 #TLS1.2
    - ECDHE-ECDSA-CHACHA20-POLY1305 #TLS1.2
    - ECDHE-RSA-CHACHA20-POLY1305 #TLS1.2
    - ECDHE-ECDSA-AES128-GCM-SHA256 #TLS1.2
    - ECDHE-RSA-AES128-GCM-SHA256 #TLS1.2
  curvePreferences:
    - X25519
    - CurveP256
    - CurveP384
--- #在`Service`模块引用此功能, 且需要Traefik-CRD;(测试失败,猜测是traefik版本问题)
apiVersion: traefik.io/v1alpha1
kind: ServersTransportTCP
metadata:
  name: proxy-protocol
spec:
  proxyProtocol:
    version: 2
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: traefik-gc
spec:
  controllerName: traefik.io/gateway-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: traefik-gtw
  namespace: default
spec:
  gatewayClassName: traefik-gc
  # addresses:
  #   - value: "xxx.xxx.xxx.xxx" #绑定ip或网卡
  listeners:
    - name: ssh
      port: 2222
      protocol: TCP
      allowedRoutes:
        kinds:
          - kind: TCPRoute
    - name: sni-frp
      protocol: TLS
      port: 443
      hostname: frp.twbhub.top
      tls:
        mode: Passthrough #透传TLS,用于四层网络SNI分流
    - name: sni-xray
      protocol: TLS
      port: 443
      hostname: "*.404502.xyz"
      tls:
        mode: Passthrough
    - name: sni-xray-target
      protocol: TLS
      port: 443
      hostname: mail.mypeter.net
      tls:
        mode: Passthrough
    - name: web
      protocol: HTTP
      port: 80
    - name: websecure-main
      protocol: HTTPS
      port: 443
      hostname: twbhub.top
      tls:
        mode: Terminate
        options:
          kind: TLSOption
          name: tls-conf
          group: traefik.io
        certificateRefs:
          - name: tls-secret #也可用traefik-TLSStore等方式配置
    - name: websecure
      protocol: HTTPS
      port: 443
      hostname: "*.twbhub.top"
      tls:
        mode: Terminate
        options:
          kind: TLSOption
          name: tls-conf
          group: traefik.io
        certificateRefs:
          - name: tls-secret
    - name: xray-main
      protocol: HTTPS
      port: 443
      hostname: 404502.xyz
      tls:
        mode: Terminate
        options:
          kind: TLSOption
          name: tls-conf
          group: traefik.io
        certificateRefs:
          - name: xray-secret
    - name: xray-www
      protocol: HTTPS
      port: 443
      hostname: www.404502.xyz
      tls:
        mode: Terminate
        options:
          kind: TLSOption
          name: tls-conf
          group: traefik.io
        certificateRefs:
          - name: xray-secret

--- #web默认流量(未匹配到其他规则时使用)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: catch-all-ip
  namespace: default
spec:
  parentRefs:
    - name: traefik-gtw
      sectionName: web
  rules:
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: block-ip
      backendRefs:
        - name: pan-svc
          port: 80
--- #xray流量reality
apiVersion: gateway.networking.k8s.io/v1
kind: TLSRoute
metadata:
  name: xray-target
  namespace: default
spec:
  parentRefs:
    - name: traefik-gtw
      sectionName: sni-xray-target
  hostnames:
    - mail.mypeter.net
  rules:
    - backendRefs:
        - name: 3x-ui-svc
          port: 443
