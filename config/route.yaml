--- #xray-主域名
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: xray-default
  namespace: default
spec:
  parentRefs:
    - name: traefik-gtw
      sectionName: xray-main
    - name: traefik-gtw
      sectionName: xray-www
  hostnames:
    - 404502.xyz
    - www.404502.xyz
  rules:
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: http
      backendRefs:
        - name: pan-svc
          port: 80
--- #traefik面板
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dashboard
  namespace: default
spec:
  parentRefs:
    - name: traefik-gtw
      sectionName: websecure
    - name: traefik-gtw
      sectionName: web
  hostnames:
    - admin.twbhub.top
    - admin.cc.cc
  rules:
    - filters:
        - type: ExtensionRef #能设置各种功能,如重定向、流量复制等,不一定要用Traefik中间件
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: http
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: auth
      matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: api@internal
          kind: TraefikService
          weight: 100 #权重设置,可用于灰度发布(金丝雀),一般设定cookie/HTTP头 从而判断是否进灰度
      timeouts:
        request: 60s #总响应超时
        backendRequest: 30s #后端响应超时
--- #网盘
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pan
  namespace: default
spec:
  parentRefs:
    - name: traefik-gtw
      sectionName: websecure
    - name: traefik-gtw
      sectionName: web
  hostnames:
    - pan.twbhub.top
    - pan.cc.cc
  rules:
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: http
      backendRefs:
        - name: pan-svc
          port: 80
--- #xray订阅
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: xray-sub
  namespace: default
spec:
  parentRefs:
    - name: traefik-gtw
      sectionName: websecure
  hostnames:
    - www.twbhub.top
    - clash.twbhub.top #兼容旧域名,后期删除!!!
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /sub
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: admin-http
      backendRefs:
        - name: 3x-ui-svc
          port: 2096
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: admin-http
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: add-sub-prefix
      backendRefs:
        - name: 3x-ui-svc
          port: 2096
